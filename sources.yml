  # ---------------- Yerel Seçim / Belediye Başkanlığı (9 seçim) ----------------

  # 2026-09-23 (dorduncu oturum): 2009/2014/2019/2024 yerel Habertürk'ten
  # YSK'nin resmi acikveri.ysk.gov.tr API'sine tasindi ("Evet, tumunu yap").
  # Bu gecişte İKİ ayrı bug bulunup düzeltildi:
  #  (1) parti-sutun eslemesi icin kullanilan onbellekli baslik_*.json
  #      dosyalari yerel secimler icin EKSIKTI (orn. baslik_2014yerel.json'da
  #      BDP sutunu hic yoktu) - oylar yanlis eslenmiyor, SESSIZCE
  #      DUSURULUYORDU. refresh_all_baslik.js ile canli yeniden cekilip
  #      duzeltildi.
  #  (2) ilk surum (fetch_and_aggregate.js) "il" kaydini o ile ait TUM
  #      ilcelerin sonuclarini toplayarak olusturuyordu - ama yerel
  #      secimlerde her ilce/buyuksehir AYRI bir yaris, bunlari toplamak
  #      hicbir gercek yarisi yansitmiyor (orn. Istanbul 2019 boylece
  #      AKP %45.9/CHP %40.3 gibi YANLIS bir sonuc veriyordu, gercekte
  #      neredeyse berabere bir yaristi). fetch_yerel_v2.js/merge_yerel_v2.py
  #      ile DUZELTILDI: buyuksehir statusundeki iller icin secimTuru=6
  #      (Buyuksehir Belediye Baskanligi, ilceId=bos) agregesi, digerleri
  #      icin sadece "<Il> MERKEZ" ilcesinin kendi secimTuru=2 sonucu "il"
  #      kaydi olarak kullanildi (butun ilceler toplanmiyor). "ilceler" ise
  #      her zaman HER ilcenin kendi ayri secimTuru=2 sonucu. Ayrinti:
  #      scripts/pipelines/election_import/PROVENANCE.md.
