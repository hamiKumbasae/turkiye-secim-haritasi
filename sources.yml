  # ---------------- Diğer ----------------

  # 2026-09-23 (dorduncu oturum): 5/8 seçim YSK'nin acikveri API'sine
  # taşındı (getSecimSandikSonucList, yurtIciDisi=2, "ÜLKELER SANDIKLAR
  # TOPLAMI" hazır-agrege satırı — gecerliOy/kullanılanOy/parti oyları
  # bu satırdan, mevcut Habertürk rakamlarıyla 2018 için birebir eşleşti).
  # 3'ü (2023 genel, 2023cb1tur, 2023cb2tur) YSK'nin bu agrege satırı
  # SIFIR dönüyor (getSecimDetayList'te de yok değil ama bu spesifik agrege
  # hesaplanmamış) — Habertürk'te kaldı. Ayrıca "secmen"/"katilim"/"sandik"
  # alanları BİLİNÇLİ OLARAK güncellenmedi (5 başarılı seçim için de) —
  # YSK'nin agrege satırının "secmen" alanı yanıltıcı (kullanılan oyla aynı
  # değer), temsilcilik-bazında gerçek satırları toplama girişimi de YSK'nin
  # arka ucunda bir veri kalitesi sorunu yüzünden onlarca milyon gibi
  # imkânsız sayılar verdi — bu 3 alan güvenilir bulunamadığı için eski
  # kaynakta bırakıldı. Ayrıntı: scripts/pipelines/election_import/
  # fetch_yurtdisi.js ve PROVENANCE.md.
  "yurtdisi-secmen":
    type: yurtdisi
    not_an_embedded_key: true
    note: "secim_tarihi_data.json.secimler{} altında ayrı bir anahtar değil — ilgili seçimlerin kendi kayıtları içinde ayrı bir alt panel/alan olarak tutuluyor. Referans için burada belgeleniyor."
    primary: {authority: YSK, url: "acikveri.ysk.gov.tr (getSecimSandikSonucList, yurtIciDisi=2, 'ÜLKELER SANDIKLAR TOPLAMI' agrege satırı)", retrieved_at: "2026-09-23", level: [ulusal], status: official}
    legacy_source: {source: Habertürk, url: "secim.haberturk.com (ayrı 'Yurtdışı' sayfaları)", level: [ulusal], status: reported}
    coverage: ["5/8 seçim YSK'ye taşındı (2015 Haziran/Kasım, 2018 genel; 2017 referandumu; 2018cb). 3'ü (2023 genel, 2023cb1tur, 2023cb2tur) YSK'nin agrege satırı boş döndüğü için Habertürk'te kaldı."]
    verification: ["2018: gecerliOy/kullanilanOy YSK agrege satırıyla Habertürk'ün mevcut rakamlarına birebir eşleşti (1.340.685 / 1.357.204)."]
    known_issues:
      - scope: "alan: secmen, katilim, sandik (5 taşınan seçimin hepsinde)"
        status: reported
        description: >
          YSK'nin "ÜLKELER SANDIKLAR TOPLAMI" agrege satırındaki secmen_SAYISI
          alanı yanıltıcı — gerçek kayıtlı seçmen sayısı değil, kullanılan oy
          sayısıyla aynı (boş/anlamsız doldurulmuş). Temsilcilik-bazında
          (disTemsilcilikId) gerçek sandık satırlarını tek tek çekip toplama
          girişimi de YSK'nin arka ucunda bir veri kalitesi sorunu (muhtemelen
          bir JOIN duplikasyonu) yüzünden onlarca milyon gibi imkânsız sayılar
          verdi. Bu üç alan güvenilir bir YSK kaynağı bulunamadığı için ESKİ
          (Habertürk) değerinde bırakıldı — sadece gecerliOy/kullanılanOy/oy
          YSK'den.
      - scope: "2023 genel, 2023cb1tur, 2023cb2tur"
        status: reported
        description: "YSK'nin acikveri API'sinde bu 3 seçim için yurtdışı agrege satırı sıfır dönüyor (getSecimDetayList'te seçimin kendisi var, ama bu spesifik özet hesaplanmamış görünüyor) — Habertürk'te kaldı."
    notes:
      - "8 seçimi kapsıyor: 2015 Haziran/Kasım, 2018, 2023 genel; 2017 referandumu; 2018, 2023 (1./2. tur) cumhurbaşkanlığı."
      - "Haritaya/il toplamlarına DAHİL DEĞİL — hiçbir ile atanamayan (plaka karşılığı yok) oylar, ayrı panelde gösteriliyor."
      - "YSK'nin aynı agrege sorgusunda ayrıca 'GÜMRÜK KAPILARI SANDIKLAR TOPLAMI' diye AYRI bir kategori var (sınır kapısı oyları, örn. 2018'de ~167 bin seçmen) — bu proje bunu hiç kullanmıyor (1988 referandumundaki aynı isimli kategoriyle aynı konvansiyon, il/ulusal toplama dahil edilmiyor)."
      - "Tahmin yok, gerçek rakamlar (sandık/geçerli/geçersiz oy dahil)."


