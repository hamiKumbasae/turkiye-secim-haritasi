# Türkiye Seçim Haritası — Veri Kaynağı Kaydı
#
# Her giriş anahtarı, index.html içindeki window.__EMBEDDED_GZ__ →
# secim_tarihi_data.json → secimler{} sözlüğünün GERÇEK anahtarıyla birebir
# aynı (2026-09-22'de index.html'den programatik olarak doğrulandı — bkz.
# meta.verified_against_keys). Böylece bu dosya elle çapraz kontrol
# gerektirmeden script'lerle sorgulanabilir.
#
# Her giriş: birincil kaynak (primary), varsa yedek/eski kaynak
# (backup / legacy_source), veri seviyesi (level), ve o girişe özgü bilinen
# sorunlar (known_issues) veya yapısal kapsam sınırları (coverage).
#
# status alanları:
#   official  — resmi kurumdan (YSK/TÜİK) doğrudan
#   reported  — resmi olmayan ama birincil kaynağı (haberturk vb.) doğrudan yansıtan
#   derived   — başka bir kaynaktan (örn. ilçe verisinden il'e toplanarak) türetilmiş
#   estimated — gerçek veri yokluğunda varsayımla hesaplanmış
#
# "OKUBENI" = ~/Desktop/2023_Secim_Verileri/OKUBENI.md — bu dosyanın çoğu, o
# belgenin 2026-09-19/20 tarihli notlarının transkripsiyonudur. "session" =
# bu depoya 2026-09-21/22'de eklenen mahalle-düzeyi YSK verisi.

meta:
  transcribed_at: "2026-09-22"
  transcribed_from: "~/Desktop/2023_Secim_Verileri/OKUBENI.md (repo dışı, dış üretim script'inin notu)"
  verified_against_keys: >
    index.html'in window.__EMBEDDED_GZ__["secim_tarihi_data.json"].secimler
    sözlüğünün anahtar listesiyle python3 üzerinden karşılaştırıldı — bu dosyadaki
    43 anahtarın hepsi orada mevcut, fazlalık/eksik yok.
  note: >
    OKUBENI.md'nin kendisi "YSK'nın açık veri portalı sandık bazlı sonuçları
    toplu/makine-okunur biçimde yayımlamıyor" diyordu (2026-09-19 notu) — bu artık
    YANLIŞ: bu oturumda acikveri.ysk.gov.tr'nin tam olarak bunu yapan
    (getSecimSandikSonucList) genel kullanıma açık bir REST API'si bulundu ve
    kullanıldı. Bu dosyadaki "session" etiketli girişler bu keşfin sonucu.

