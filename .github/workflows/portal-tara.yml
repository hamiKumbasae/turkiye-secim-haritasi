name: portal-tara

# Acik veri portallarinda mahalle/koy siniri veri seti arar (portal_tara.py); indirme yapmaz, sonuc ::notice.
# Portallar gelistirme ortamindan acilmiyor, GitHub sunucularindan aciliyor. Elle calistirilir.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/pipelines/mahalle_veri/fetch/portal_tara.py
