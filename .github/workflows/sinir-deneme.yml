name: sinir-deneme

# Gecici erisim/kapsam testi: mahalle sinirlari icin TKGM idari yapi servisi ve OpenStreetMap (Overpass).
# Yalniz okuma; sonuc GitHub notu olarak yazilir. Test bitince dosya silinecek.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sinir-deneme.yml"]

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: TKGM
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
          B=https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api/idariYapi
          curl -sS --max-time 40 -A "$UA" "$B/ilListe" -o il.json
          IL=$(python3 -c "import json;d=json.load(open('il.json'));print([f['properties']['id'] for f in d['features'] if 'MARA' in f['properties']['text'].upper()][0])")
          echo "::notice title=TKGM il::$(python3 -c "import json;d=json.load(open('il.json'));print(len(d['features']),'il; Kahramanmaras id', $IL)")"
          curl -sS --max-time 40 -A "$UA" "$B/ilceListe/$IL" -o ilce.json
          ID=$(python3 -c "import json;d=json.load(open('ilce.json'));print([f['properties']['id'] for f in d['features'] if 'ON' in f['properties']['text'].upper()[:2] and 'UBAT' in f['properties']['text'].upper()][0])")
          echo "::notice title=TKGM ilce::$(python3 -c "import json;d=json.load(open('ilce.json'));print(len(d['features']),'ilce:',[f['properties']['text'] for f in d['features']])") Onikisubat id $ID"
          curl -sS --max-time 90 -A "$UA" "$B/mahalleListe/$ID" -o mah.json -w "%{http_code}" > kod.txt
          python3 - <<'PY'
          import json,collections
          d=json.load(open('mah.json'));F=d.get('features',[])
          t=collections.Counter((f.get('geometry') or {}).get('type') for f in F)
          print("::notice title=TKGM Onikisubat mahalleListe::HTTP",open('kod.txt').read(),len(F),"birim, geometri",dict(t),"; ozellikler",F[0]['properties'] if F else None,"; adlar",[f['properties'].get('text') for f in F[:12]])
          PY
      - name: OpenStreetMap
        if: always()
        run: |
          for L in 8 9 10; do
            Q="[out:json][timeout:60];area[\"ISO3166-2\"=\"TR-46\"][admin_level=4]->.a;rel(area.a)[boundary=administrative][admin_level=$L];out tags;"
            N=$(curl -sS --max-time 90 --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter | python3 -c "import json,sys;d=json.load(sys.stdin);e=d.get('elements',[]);print(len(e), [x['tags'].get('name') for x in e[:4]])" 2>&1 | head -c 300)
            echo "::notice title=OSM Kahramanmaras admin_level=$L::$N"
          done
          Q='[out:json][timeout:60];area["ISO3166-2"="TR-46"][admin_level=4]->.a;node(area.a)[place~"^(village|hamlet|neighbourhood|suburb|quarter)$"];out tags;'
          N=$(curl -sS --max-time 90 --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter | python3 -c "import json,sys,collections;d=json.load(sys.stdin);print(dict(collections.Counter(x['tags'].get('place') for x in d.get('elements',[]))))" 2>&1 | head -c 300)
          echo "::notice title=OSM Kahramanmaras yer noktalari::$N"
