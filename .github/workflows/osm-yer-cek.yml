name: osm-yer-cek

# OpenStreetMap'teki koy/mahalle yer noktalarini (place=village/neighbourhood/...; ad ve eski ad etiketleriyle)
# Overpass'tan il il ceker (fetch_osm_yer.py) ve "osm-yer-veri" dalina data/raw/osm/yer/ olarak yazar.
# Eski adli TKGM sinirlarini guncel muhtarliklara konumla baglamak icin (tkgm_muhtarlik_esle.py).
# Overpass gelistirme ortamindan acilmiyor, GitHub sunucularindan aciliyor. Ayni anda en cok 2 grup.
# Elle calistirilir (workflow_dispatch); ilk tam cekim 2026-10-26.
on:
  workflow_dispatch:
    inputs:
      iller:
        description: "Yalniz bu iller (virgullu plaka, ornek 46,80); bos = hepsi"
        required: false
        default: ""
      onceki_run:
        description: "Verisi de kaydedilecek onceki calistirmanin kimligi (bos = yok)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        grup: ["46,31,65,34,1,33,27,38", "6,35,16,7,42,41,21,55,45,63,44,20,9,10,61",
               "2,3,4,5,8,11,12,13,14,15,17,18,19,22,23,24,25,26,28,29",
               "30,32,36,37,39,40,43,47,48,49,50,51,52,53,54,56,57,58,59,60",
               "62,64,66,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek
        run: |
          GRUP="${{ matrix.grup }}"
          if [ -n "${{ inputs.iller }}" ]; then
            # yalniz istenen iller: her grup kendi listesindekileri ceker
            GRUP=$(python3 -c "import sys; g=sys.argv[1].split(','); i=sys.argv[2].split(','); print(','.join(x for x in g if x in i))" "$GRUP" "${{ inputs.iller }}")
          fi
          if [ -n "$GRUP" ]; then python3 scripts/pipelines/mahalle_veri/fetch/fetch_osm_yer.py cikti "$GRUP"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-yer-${{ strategy.job-index }}
          path: cikti/
          if-no-files-found: ignore

  kaydet:
    needs: cek
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
      - if: inputs.onceki_run != ''
        uses: actions/download-artifact@v4
        with:
          path: onceki
          run-id: ${{ inputs.onceki_run }}
          github-token: ${{ github.token }}
      - name: osm-yer-veri dalina yaz
        run: |
          set -o pipefail
          trap 'echo "::error title=kaydet::satir $LINENO: $BASH_COMMAND"' ERR
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dal varsa uzerine ekle (yalniz bazi illeri ceken calistirma digerlerini silmesin)
          # dal yalniz veriyi tasir (yetim dal): is akisi dosyalari ona hic itilmez
          if git fetch origin osm-yer-veri; then git checkout -q -B osm-yer-veri FETCH_HEAD; else git checkout -q --orphan osm-yer-veri && git rm -rq --cached . && git clean -fdq -e indirilen -e onceki; fi
          mkdir -p data/raw/osm/yer
          # once onceki calistirma, sonra bu calistirma (yenisi ustune yazar); bos ([]) dosyalar alinmaz
          for d in onceki indirilen; do
            for f in $d/*/*.json; do
              [ -f "$f" ] || continue
              [ "$(head -c 2 "$f")" = "[]" ] && continue
              cp "$f" data/raw/osm/yer/
            done
          done
          git add data/raw/osm/yer
          git diff --cached --quiet || git commit -q -m "OSM koy/mahalle yer noktalari, run ${{ github.run_id }}"
          git push origin osm-yer-veri 2>&1 | tee push.log || { echo "::error title=push::$(tail -5 push.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=kaydedildi::$(ls data/raw/osm/yer | wc -l) il: $(ls data/raw/osm/yer | tr '\n' ' ')"
