name: tkgm-eksik-cek

# TKGM'nin ilk cekimde sinirini bos dondurdugu birimleri yeniden sorar (fetch_tkgm_eksik.py) ve sonucu
# "tkgm-eksik-veri" dalina data/raw/tkgm/eksik/ olarak yazar (yetim dal, yalniz veri). Birlestirme yerelde.
# Servis gelistirme ortamindan acilmiyor, GitHub sunucularindan aciliyor. 4 grup, istek sayisina gore dengeli.
# Elle calistirilir (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        grup: ["6,7,8,12,19,28,30,35,36,37,43,47,48,55,57,64,67,76,79",
               "1,3,4,9,10,15,26,27,34,38,39,49,51,59,60,66,68,74,80",
               "11,16,17,18,20,22,25,33,45,46,50,56,58,61,62,69,71,73,78",
               "2,5,13,14,21,23,31,32,40,41,42,52,53,54,65,70,72,75,81"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - name: Cek
        run: python3 scripts/pipelines/mahalle_veri/fetch/fetch_tkgm_eksik.py cikti "${{ matrix.grup }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkgm-eksik-${{ strategy.job-index }}
          path: cikti/
          if-no-files-found: ignore

  kaydet:
    needs: cek
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
      - name: tkgm-eksik-veri dalina yaz
        run: |
          set -o pipefail
          trap 'echo "::error title=kaydet::satir $LINENO: $BASH_COMMAND"' ERR
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin tkgm-eksik-veri; then git checkout -q -B tkgm-eksik-veri FETCH_HEAD; else git checkout -q --orphan tkgm-eksik-veri && git rm -rq --cached . && git clean -fdq -e indirilen; fi
          mkdir -p data/raw/tkgm/eksik
          for f in indirilen/*/*.json; do [ -f "$f" ] && cp "$f" data/raw/tkgm/eksik/; done
          git add data/raw/tkgm/eksik
          git diff --cached --quiet || git commit -q -m "TKGM bos sinirlarin yeniden cekimi, run ${{ github.run_id }}"
          git push origin tkgm-eksik-veri 2>&1 | tee push.log || { echo "::error title=push::$(tail -5 push.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=kaydedildi::$(ls data/raw/tkgm/eksik | wc -l) il"
