name: ysk-mahalle-cek

# YSK acik veri: secilen illerde muhtarlik duzeyi sonuclar, BUTUN partilerle (fetch_muhtarlik_tum.js).
# Ciktilar "tkgm-veri" dalina data/raw/ysk/muhtarlik/<secim>.json olarak eklenir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ysk-mahalle-cek.yml"]

permissions:
  contents: read

env:
  PLAKALAR: "1,6,7,9,10,16,20,21,25,26,27,31,33,34,35,38,41,42,44,45,46,47,48,52,54,55,59,61,63,65"

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { anahtar: "2015Haziran", secimId: 13884, baslik: baslik_2015Haziran.json }
          - { anahtar: "2015Kasim",   secimId: 14868, baslik: baslik_2015Kasim.json }
          - { anahtar: "2018",        secimId: 16300, baslik: baslik_2018.json }
          - { anahtar: "2023",        secimId: 20230, baslik: baslik_genel_2023.json }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        working-directory: scripts/pipelines/mahalle_veri
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Cek
        run: |
          mkdir -p cikti
          NODE_PATH=scripts/pipelines/mahalle_veri/node_modules node scripts/pipelines/mahalle_veri/fetch/fetch_muhtarlik_tum.js \
            ${{ matrix.anahtar }} ${{ matrix.secimId }} 8 scripts/pipelines/mahalle_veri/parti-sutun-eslemeleri/${{ matrix.baslik }} \
            "$PLAKALAR" cikti/${{ matrix.anahtar }}.json | tail -5
          python3 -c "
          import json;d=json.load(open('cikti/${{ matrix.anahtar }}.json'))
          m=sum(len(v['muhtarliklar']) for v in d['ilceler'].values()); s=sum(x['secmen'] for v in d['ilceler'].values() for x in v['muhtarliklar'].values())
          print('::notice title=${{ matrix.anahtar }}::',len(d['ilceler']),'ilce,',m,'muhtarlik,',s,'secmen,',len(d['hatalar']),'hata')"
      - uses: actions/upload-artifact@v4
        with:
          name: muhtarlik-${{ matrix.anahtar }}
          path: cikti/${{ matrix.anahtar }}.json

  kaydet:
    needs: cek
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
      - name: tkgm-veri dalina ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin tkgm-veri >/dev/null; then git fetch origin tkgm-veri && git checkout -B tkgm-veri origin/tkgm-veri; else git checkout -B tkgm-veri; fi
          mkdir -p data/raw/ysk/muhtarlik && cp indirilen/*/*.json data/raw/ysk/muhtarlik/
          git add data/raw/ysk/muhtarlik
          git commit -m "YSK muhtarlik sonuclari (butun partiler), run ${{ github.run_id }}"
          for i in 1 2 3; do git push origin tkgm-veri && break; git pull --rebase origin tkgm-veri; done
          echo "::notice title=kaydedildi::$(ls -la data/raw/ysk/muhtarlik | tail -n +2 | awk '{print $5, $9}' | tr '\n' ' ')"
