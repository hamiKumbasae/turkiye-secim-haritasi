name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Yayın verisi doğruluk kontrolleri
        run: python3 scripts/validate_public_data.py

      - name: Hızlı yapısal doğrulama
        run: python3 scripts/validate.py

      - name: Analitik doğrulama (checksum, ulusal toplamlar, senkron/reproducibility)
        run: python3 tests/validate_elections.py

      - name: index.html'i yeniden üret
        run: python3 scripts/build.py

      - name: Commit'li index.html güncel mi (build sonrası fark olmamalı)
        run: git diff --exit-code index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kaynak onarım ve bağımsız oy regresyonları
        run: node --test tests/ballot_votes.test.cjs tests/data-integrity.test.cjs

      - name: Tarayıcı smoke test bağımlılıklarını kur
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Tarayıcı smoke testleri (2023 genel, 1950/1955 yerel, 2024 ilçe meclisi, referandum)
        working-directory: tests
        run: node browser_smoke.js
