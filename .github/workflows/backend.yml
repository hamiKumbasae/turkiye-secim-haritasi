# Backend (Spring Boot mikroservisleri): testler + docker compose ile uçtan uca duman testi.
# Yalnız backend'i ya da yüklediği veriyi değiştiren push/PR'larda çalışır; GitHub Pages sitesini etkilemez.
name: backend

on:
  push:
    paths:
      - "backend/**"
      - "data/normalized/**"
      - "geo/normalized/mahalle_geo.json"
      - "sources.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "data/normalized/**"
      - "geo/normalized/mahalle_geo.json"
      - "sources.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testler:
    name: Maven testleri (MySQL 8.4 Testcontainers dahil)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            data/normalized/partiler.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Docker 29+ eski API sürümlerini reddediyor; Testcontainers'a sürüm açıkça verilir (bkz. backend/README.md).
      - name: Testcontainers için Docker API sürümü
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Başarısız testlerin özeti
        if: failure()
        run: |
          # Ham raporlara erişilemeyen ortamlar için: derleme hatası ve başarısız testler iş ek açıklaması olarak
          ozet() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          for f in */target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              echo "::error title=$(basename "$f" .txt)::$(grep -E -A12 '<<< (FAILURE|ERROR)' "$f" | grep -v '^\s*at org\.\|^\s*at java\.' | head -40 | cut -c1-300 | ozet)"
            fi
          done
          mvn -B -ntp -q -DskipTests compile test-compile 2>&1 | grep -E "ERROR|error:" | head -30 | cut -c1-300 > /tmp/derleme.txt || true
          [ -s /tmp/derleme.txt ] && echo "::error title=derleme::$(ozet < /tmp/derleme.txt)" || true

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: backend/*/target/surefire-reports/
          if-no-files-found: ignore

  compose:
    name: docker compose duman testi (gerçek veriyle)
    needs: testler
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            data/normalized
            geo/normalized/mahalle_geo.json
            sources.yml

      - name: .env (rastgele şifreler)
        run: |
          rastgele() { openssl rand -hex 16; }
          sed -e "s/degistir-kok-sifresi/$(rastgele)/" \
              -e "s/degistir-yukleme-sifresi/$(rastgele)/" \
              -e "s/degistir-okuma-sifresi/$(rastgele)/" .env.example > .env

      - name: docker compose up
        run: docker compose up --build -d

      - name: data-loader bitti mi
        run: |
          kod=$(docker inspect -f '{{.State.ExitCode}} {{.State.Status}}' "$(docker compose ps -a -q data-loader)")
          echo "data-loader: $kod"
          test "$kod" = "0 exited"
          docker compose logs --no-color data-loader | grep "Yükleme tamam"
          docker compose logs --no-color data-loader | grep "Ek veri"
          docker compose logs --no-color data-loader | grep "Tutarlılık bulguları"

      - name: veri değişmediyse yükleme atlanır
        run: |
          docker compose run --rm data-loader 2>&1 | tee /tmp/ikinci.log | tail -5
          grep "yükleme atlandı" /tmp/ikinci.log

      - name: gateway hazır mı
        run: |
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8080/api/secimler?tur=genel" -o /dev/null && exit 0
            sleep 3
          done
          echo "gateway 3 dakikada yanıt vermedi"; exit 1

      - name: uç noktalar
        run: |
          set -euo pipefail
          api=http://localhost:8080/api
          # 20 genel seçim; 91 oylama (46 ana seçim + 26 meclis + 8 Senato + 11 ara/yenileme)
          test "$(curl -sf "$api/secimler?tur=genel" | jq length)" = "20"
          test "$(curl -sf "$api/secimler" | jq length)" = "91"
          test "$(curl -sf "$api/secimler?oylama=belediye_meclisi" | jq length)" = "15"
          test "$(curl -sf "$api/secimler/2024yerel/bagli-oylamalar" | jq -c '[.[].secimId]')" = '["2024yenileme_belediye_baskanligi","2024yerel_bm","2024yerel_igm"]'
          test "$(curl -sf "$api/secimler/1961senato/iller" | jq length)" = "67"
          # Ek veri: Ümraniye'nin 2023 mahalleleri, 2023 milletvekilleri ve kapsamı, Çankaya 2024 meclisi
          test "$(curl -sf "$api/secimler/2023/ilceler/TR-D-34-037/mahalleler" | jq length)" = "35"
          test "$(curl -sf "$api/secimler/2023/ilceler/TR-D-34-037/mahalleler" | jq '[.[] | select(.ad != null)] | length')" = "35"
          test "$(curl -sf "$api/secimler/2023/secilenler" | jq length)" = "405"
          test "$(curl -sf "$api/secimler/2023/kapsam" | jq -c '.[0] | [.bulunan, .beklenen, .durum]')" = '[405,600,"eksik"]'
          test "$(curl -sf "$api/secimler/2024yerel_bm/sandalyeler?ilceId=TR-D-06-007" | jq '[.[].sandalye] | add')" = "90"
          test "$(curl -sf "$api/secimler/2024yerel/beldeler" | jq length)" -gt 300
          # 2023: 81 il + yurt dışı; İstanbul'un oyları dolu
          test "$(curl -sf "$api/secimler/2023/iller" | jq length)" = "82"
          test "$(curl -sf "$api/secimler/2023/iller/34" | jq '.oylar | length')" -gt 5
          # İstanbul'un 39 ilçesi
          test "$(curl -sf "$api/secimler/2023/iller/34/ilceler" | jq length)" = "39"
          # Parti devamlılığı: DEM Parti'nin öncülü YEŞİL SOL
          test "$(curl -sf "$api/partiler/107" | jq -r '.oncekiler[0].ad')" = "YEŞİL SOL"
          # Bulunamayan kayıt 404, yazma isteği geçmez
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/secimler/9999")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$api/secimler/2023")" = "404"
          # CORS: GitHub Pages ön kontrolü
          curl -s -D - -o /dev/null -X OPTIONS "$api/secimler" \
            -H "Origin: https://hamikumbasae.github.io" -H "Access-Control-Request-Method: GET" \
            | tee /dev/stderr | grep -i "access-control-allow-origin: https://hamikumbasae.github.io"
          echo "bütün kontroller geçti"

      - name: Servis logları
        if: failure()
        run: |
          docker compose logs --no-color --tail=300
          # Ham log dosyalarına erişilemeyen ortamlar için özet, iş ek açıklaması (annotation) olarak
          ozet() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=compose ps::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | ozet)"
          for s in mysql data-loader election-api gateway; do
            echo "::error title=$s log::$(docker compose logs --no-color --no-log-prefix --tail=25 $s 2>&1 | cut -c1-300 | ozet)"
          done

      - name: Tutarlılık logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutarlilik-logu
          path: backend/logs/
          if-no-files-found: ignore

      - name: Kapat
        if: always()
        run: docker compose down -v
