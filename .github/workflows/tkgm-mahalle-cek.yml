name: tkgm-mahalle-cek

# TKGM idari yapi servisinden mahalle/koy sinirlarini ceker (fetch_tkgm_mahalle.py), sitedeki
# yogunluga sadelestirir ve "tkgm-veri" dalina data/raw/tkgm/mahalle/ olarak yazar.
# Servis gelistirme ortamindan acilmiyor, GitHub sunucularindan aciliyor. Iller gruplara bolunur,
# ayni anda en cok 3 grup (servise yuk bindirmemek icin); her grup kendi sonucunu yarim kalsa da saklar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/tkgm-mahalle-cek.yml"]

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        grup: ["34,6,35,16,7", "1,33,31,46,65", "21,25,63,27,47", "45,55,26,38,41", "42,10,59,9,48", "54,20,44,52,61"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - name: Cek
        run: python3 scripts/pipelines/mahalle_veri/fetch/fetch_tkgm_mahalle.py cikti "${{ matrix.grup }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkgm-${{ strategy.job-index }}
          path: cikti/
          if-no-files-found: ignore

  kaydet:
    needs: cek
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
      - name: tkgm-veri dalina yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B tkgm-veri
          mkdir -p data/raw/tkgm/mahalle && cp indirilen/*/* data/raw/tkgm/mahalle/
          git add data/raw/tkgm/mahalle
          git commit -m "TKGM mahalle sinirlari (sadelestirilmis), run ${{ github.run_id }}"
          git push -f origin tkgm-veri
          echo "::notice title=kaydedildi::$(ls data/raw/tkgm/mahalle | grep -c geojson) il, $(du -sh data/raw/tkgm/mahalle | cut -f1)"
