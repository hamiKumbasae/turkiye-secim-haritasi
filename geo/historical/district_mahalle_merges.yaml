          - "ŞAHİNTEPE MAH."

  esenyurt:
    new_district_geomid: TR-D-34-018
    law_list_no: 20
    source:
      - "https://www.mevzuat.gov.tr/mevzuatmetin/1.5.5747.pdf (Ek 20 sayılı liste)"
      - "https://cdn.tbmm.gov.tr/KKBSPublicFile/D23/Y2/T1/KanunMetni/2af6a825-3e55-49e3-8b03-3d0b85ad6503.html"
    old_parent: ["Büyükçekmece (Esenyurt + Kıraç İlk Kademe Belediyeleri üzerinden, kendi eski ilçeleri sadece blog-kaynaklı)", "Büyükçekmece (Yakuplu İlk Kademe Belediyesi üzerinden, 1 mahalle)", "Avcılar (1 kısmi mahalle)", "Bahçeşehir İlk Kademe Belediyesi (1 kısmi mahalle)"]
    confidence: research_needed
    geometry_basis: >
      HENUZ URETILMEDI. Esenyurt Ilk Kademe Belediyesi'nin 16 tam
      mahallesi TEK BASINA guclu bir aday olabilirdi ama (a) bu mahallelerin
      kendisinin hangi ESKI ilceye (Buyukcekmece varsayimi, SADECE blog
      kaynakli) bagli oldugu dogrulanmadi, (b) Kirac kaynagindaki "Merkez"
      ve "Namik Kemal" isimleri Esenyurt'un KENDI listesindeki AYNI
      isimlerle CAKISIYOR (Sancaktepe'deki Abdurrahmangazi/Osmangazi
      cakismasiyla AYNI turden risk), (c) Avcilar ve Bahcesehir katkilari
      PARCA (yol-sinirli). Butun giris research_needed olarak birakildi.
    note: >
      Kanunun (20) sayili listesi TAM METIN (2 bagimsiz kaynaktan
      dogrulandi, ayrica bagimsiz arastirma ajaninin mevzuat.gov.tr resmi
      PDF okumasiyla UCUNCU kez dogrulandi) - ONCEKI OTURUMUN "celiskili
      kaynaklar" notu artik COZULDU: kanunun kendisi 5 kaynagi da (Esenyurt+
      Kirac+Yakuplu+Avcilar+Bahcesehir) ACIKCA listeliyor, "sadece
      Buyukcekmece" diyen eski web-arastirmasi YANLIS/EKSIKTI (muhtemelen
      "Esenyurt'un kendisi 2004'e kadar Buyukcekmece'ye bagliydi" genel
      tarihsel bilgisiyle "2008'de Esenyurt'a hangi mahalleler katildi"
      sorusunu karistirmis).

      Esenyurt Ilk Kademe Belediyesine bagli (16 tam mahalle): Ardicli,
      Fatih, Mehtercesme, Ornek, Talatpasa, Yenikent, Cumhuriyet, Pinar,
      Yesilkent, Merkez, Sanayi, Esenkent, Inonu, Namik Kemal, Saadetdere,
      Incirtepe.
      Kirac Ilk Kademe Belediyesine bagli: Merkez, Namik Kemal (ISIM
      CAKISMASI: Esenyurt'un KENDI listesinde de "Merkez" ve "Namik Kemal"
      var - hangi modern mahallenin hangi kaynaktan geldigi/ikisinin
      birlesip birlesmedigi belirsiz) + 1 PARCA: "Cakmakli TEM-D100
      baglanti yolunun DOGUSU" (bu yolun BATISI ise kanunun ayri bir
      maddesiyle - madde 1 fikra (4) - dogrudan BUYUKCEKMECE ilce
      belediyesine verilmis, CAPRAZ TUTARLI).
      Yakuplu Ilk Kademe Belediyesine bagli: "Guzelyurt (Haramidere)" (1 tam
      mahalle - kanunun govde metni [madde 1/20] Yakuplu'nun ESAS COGUNLUGUNUN
      Beylikduzu'ne (Gurpinar ile birlikte) katildigini soyluyor, bu SADECE
      TEK bir mahallesinin istisna olarak Esenyurt'a geldigini gosteriyor).
      Avcilar Ilce Belediyesine bagli: "Yesilkent Mahallesinin O3 ile D100
      baglanti yolunun BATISINDA kalan kismi" (PARCA, Esenyurt'un KENDI
      "Yesilkent" mahallesiyle de ISIM CAKISIYOR).
      Bahcesehir Ilk Kademe Belediyesine bagli: "2. Kisim Mahallesinin
      Hadimkoy-Hosdere/Esenyurt-Hadimkoy yolunun BATISINDA ve Sanayi
      Mahallesinin Kuzeyinde kalan kismi" (PARCA - bu yolun DOGUSU
      Basaksehir'e gidiyor, bkz. yukarida basaksehir girisi, iki liste
      birbirini TAM DOGRULUYOR).

      Esenyurt/Kirac/Yakuplu/Bahcesehir Ilk Kademe Belediyelerinin KENDISI
      hangi ilceye bagliydi? -> BUYUKCEKMECE iddiasi (hepsi icin tutarli
      yonde) ama SADECE blog-duzeyi kaynaklar (istanbulilceleri.com.tr ve
      benzerleri: "Esenyurt 4 Temmuz 1987'de Buyukcekmece ilce olunca
      bagli oldu, 2004'te 5216 sayili kanunla ilk kademe belediyesi oldu";
      "Yakuplu 1987'de Buyukcekmece'nin koylerinden biriydi"). Buyukcekmece
      Belediyesi'nin KENDI resmi tarihce sayfasi bunlari NE DOGRULUYOR NE
      CURUTUYOR (sadece Tepecik/Mimarsinan/Kumburgaz'dan bahsediyor).
      DOGRULANMADI.
    sources: []  # isim cakismalari (Merkez/Namik Kemal/Yesilkent) cozulmeden ve eski-ilce dogrulanmadan script'e verilmiyor
