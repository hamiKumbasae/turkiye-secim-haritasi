  basaksehir:
    new_district_geomid: TR-D-34-008
    law_list_no: 17
    source:
      - "https://www.mevzuat.gov.tr/mevzuatmetin/1.5.5747.pdf (Ek 17 sayılı liste)"
      - "https://cdn.tbmm.gov.tr/KKBSPublicFile/D23/Y2/T1/KanunMetni/2af6a825-3e55-49e3-8b03-3d0b85ad6503.html"
    old_parent: ["Küçükçekmece (5 tam mahalle + 1 kısmi mahalle + Şamlar köyünün çoğunluğu)", "Esenler (1 mahalle, isim çakışmalı)", "Bahçeşehir İlk Kademe Belediyesi (2 kısmi mahalle, kendi eski ilçesi belirsiz)"]
    confidence: research_needed
    geometry_basis: >
      HENUZ URETILMEDI. Kucukcekmece'nin 5 tam mahallesi TEK BASINA
      "verified" olabilirdi ama geri kalan katkilarin (Esenler'in ayni-isimli
      "Basaksehir" mahallesi, Bahcesehir'in 2 kismi mahallesi, Samlar
      koyunun baraj-golu-sinirli parcasi) HEPSI PARCA/BELIRSIZ - script'in
      "hide" mekanizmasi yeni ilcenin TUM guncel seklini gizledigi icin,
      SADECE Kucukcekmece'nin 5 tam mahallesini isleyip digerlerini
      atlamak, kalan alani (Esenler-Basaksehir, Bahcesehir parcalari,
      Samlar) hicbir tarihsel poligonda GOSTERMEDEN kaybeder - bu GERCEK
      bir delik/hata olur, bu yuzden BUTUN giris research_needed olarak
      birakildi.
    note: >
      Kanunun (17) sayili listesi TAM METIN (2 bagimsiz kaynaktan
      dogrulandi, ayrica bagimsiz arastirma ajaninin mevzuat.gov.tr resmi
      PDF okumasiyla UCUNCU kez dogrulandi):

      Kucukcekmece Ilce Belediyesine bagli (5 tam mahalle): Kayabasi, Ziya
      Gokalp, Guvercintepe, Altinsehir, Sahintepe. + "Basaksehir" (TAM,
      6.mahalle - ama bkz. asagida, ayni isimli IKINCI bir mahalle Esenler'den
      de geliyor). + 1 PARCA: "Mehmet Akif Mahallesinin TEM'in kuzeyinde
      kalan kismi".
      Esenler Ilce Belediyesine bagli (1 mahalle): "Basaksehir" - kanunun
      KENDISI Kucukcekmece'nin "Basaksehir" mahallesiyle AYNI ISMI IKINCI
      KEZ kullaniyor (iki farkli kaynaktan, muhtemelen bitisik, iki ayri
      "Basaksehir" parcasi TEK modern mahallede birlesmis olabilir - GUNCEL
      Basaksehir mahalle_geo.json'da SADECE bir "BAŞAKŞEHİR MAH." var).
      Bahcesehir Ilk Kademe Belediyesine bagli (2 PARCA): "1. Kisim
      Mahallesinin O3'un kuzeyinde kalan kismi" + "2. Kisim Mahallesinin
      Hadimkoy-Hosdere/Esenyurt-Hadimkoy yolunun DOGUSUNDA kalan kismi"
      (bu yolun BATISI ise ayni kanunun (20) sayili listesiyle Esenyurt'a
      gidiyor - bkz. asagida esenyurt girisi, iki liste birbirini TAM
      DOGRULUYOR/TAMAMLIYOR).

      KOYLER: "Samlar Koyu (Kucukcekmece, Merkez Bucagi) - Sazlidere Baraj
      Golunun BATISINDA, DOGUSUNDA ve GUNEYINDE Kalan Kismi." Bu, Samlar
      koyunun COGUNLUGU demek - golun KUZEY kismi ayrica Arnavutkoy'un
      Hacimasli (orman) koyune katildi (bkz. yukarida arnavutkoy girisi,
      Ek 15'teki not). Samlar koyu boylece IKIYE bolunmus: guney/dogu/bati
      -> Basaksehir, kuzey -> Arnavutkoy. Modern Basaksehir'de "ŞAMLAR"
      adinda ayri bir mahalle GUNCEL veride yok/dogrulanmadi (bu turda
      Basaksehir'in mahalle_geo.json listesi ISIM BAZINDA kanunla tek tek
      karsilastirilmadi) - baraj-golu-sinirli bir parca oldugu icin PARCA
      kalacak.

      "Basak" mahallesi (guncel mahalle_geo'da var, kanunun (17) sayili
      listesinde YOK): kanunun listesinde IKI ayri "Basaksehir" mahallesi
      var (Kucukcekmece + Esenler kaynakli) - bir HIPOTEZ (SADECE
      ikincil/blog kaynakli, dogrulanmadi): "Basak" muhtemelen bu ikisinden
      birinin (Esenler kaynaklisinin) 2008-sonrasi yeniden adlandirilmis
      hali. Resmi bir isim-degisikligi kaydi BULUNAMADI - dogrulanmadi.

      Bahcesehir Ilk Kademe Belediyesi'nin KENDISI hangi ilceye bagliydi?
      -> BUYUKCEKMECE iddiasi: SADECE blog-duzeyi web arama sentezi
      (istanbulilceleri.com.tr ve benzerleri). Buyukcekmece Belediyesi'nin
      KENDI resmi tarihce sayfasi (bcekmece.bel.tr/icerik/kurumsal/tarihimiz)
      Bahcesehir'den HIC BAHSETMIYOR - ne dogruluyor ne curutuyor.
      DOGRULANMADI.
    sources:
