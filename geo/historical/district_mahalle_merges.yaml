# Tarihsel ilce/mahalle birlesim kaydi — "eski (once-2008 vb.) ilce X aslinda
# bugunku hangi ilce+mahallelerin toplamiydi" sorusunun CEVABI, resmi kanun
# metnine dayali olarak.
#
# NEDEN BU DOSYA VAR: buyuksehir ilcelerinin 2008 (5747 sayili kanun) ve
# sonrasindaki bolunmeleri COGUNLUKLA mahalle bazinda, BIRDEN FAZLA eski
# ilceden parca alinarak yapildi (orn. Atasehir = Kadikoy'den 7 + Uskudar'dan
# 3 + Kartal'dan 1 mahalle). Bu yuzden "yeni ilce X'in TUMUNU eski ilce Y'ye
# geri ver" gibi basit bir es-esleme YANLIS olur - dogru sonuc icin YENI
# ilcenin HANGI MAHALLESININ HANGI ESKI ILCEDEN geldigini bilmek gerekir.
#
# KAYNAK: 5747 sayili "Buyuksehir Belediyesi Sinirlari Icerisinde Ilce
# Kurulmasi..." Kanunu (Kabul: 6 Mart 2008, Resmi Gazete: 22 Mart 2008,
# Sayi: 26824 Mukerrer). Iki BAGIMSIZ birincil kaynaktan birebir okundu ve
# CAPRAZ DOGRULANDI (2026-09-23 oturumunda):
#   - https://www.mevzuat.gov.tr/mevzuatmetin/1.5.5747.pdf (T.C. Mevzuat
#     Bilgi Sistemi, guncel/konsolide metin - Ek 15/17/20/21/22'de "sonradan
#     degistirildi" dipnotu YOK, yani 2008 orijinaliyle birebir ayni).
#   - https://cdn.tbmm.gov.tr/KKBSPublicFile/D23/Y2/T1/KanunMetni/2af6a825-3e55-49e3-8b03-3d0b85ad6503.html
#     (TBMM'nin kendi kanun metni arsivi).
#   - https://www.lexpera.com.tr/mevzuat/kanunlar/buyuksehir-belediyesi-sinirlari-icerisinde-ilce-kurulmasi-ve-bazi-kanunlarda-degisiklik-yapilmasi
#     (uculcu capraz kontrol, Atasehir icin onceki oturumda kullanilmisti).
#
# confidence alani:
#   verified   — kanunun EKLI LISTESINDEKI mahalle isimleri, GUNCEL
#                mahalle_geo.json ile TAM (isim+sayi) eslesti, kalinti/artik
#                parca YOK (butun yeni ilce mahalleleri eski ebeveynlere TAM
#                dagitildi). apply_verified_district_merges.py SADECE bu
#                seviyedeki girisleri isler - "hide" mekanizmasi yeni ilcenin
#                GUNCEL sekliniTUMUYLE gizledigi icin (bkz. o script), KISMI
#                (bazi mahalleler eslesmis bazilari degil) bir girisi
#                "verified" isaretlemek GERCEK BIR DELIK/HATA uretir - bu
#                yuzden asagidaki hicbir 2026-09-23 girisi (Sancaktepe/
#                Arnavutkoy/Basaksehir/Esenyurt/Sultangazi) tam kapsama
#                saglanamadigi icin "verified"e YUKSELTILMEDI (bkz. her
#                girisin "geometry_basis" alani).
#   partial    — kanun metni BULUNDU ve cogunlukla NET ama GUNCEL mahalle
#                sinirlariyla TAM eslesmiyor (orn. yol/baraj/parsel sinirli
#                kismi bolunmeler - "Mahalle X'in ... yolunun kuzeyinde
#                kalan kismi" gibi - modern mahalle bu ayrimi yansitmiyorsa
#                GUVENLE birlestirilemez) VEYA modern mahalle listesinde
#                kanunun bir ismi (orn. Sultangazi'de "Ismet Pasa")
#                BULUNAMIYOR (muhtemelen yeniden adlandirilmis, dogrulanmadi).
#                BU SEVIYEDEKILER SU AN ISLENMIYOR (script atliyor).
#   research_needed — mahalle/koy listesi kanundan DOGRULANDI (verified
#                duzeyinde) AMA en az bir "Ilk Kademe Belediyesi"nin KENDI
#                2008-oncesi baglı oldugu ILCE (Arnavutkoy/Basaksehir/
#                Esenyurt'un bazi kaynaklari icin) sadece blog/ikincil
#                kaynaktan biliniyor, birincil kaynakla (kanun metni resmi
#                kurum sayfasi/idari yillik) DOGRULANAMADI - tahminle
#                atanmayacak (bkz. kullanicinin acik talimati).
#
# NOT (2026-09-23 arastirma turu): bu depodaki 1994/1999/2004 yerel secim
# kayitlari SADECE (pre-2008) ILCE duzeyinde satir iceriyor - "Samandira",
# "Sarigazi", "Bahcesehir", "Kirac" vb. HICBIR "Ilk Kademe Belediyesi" kendi
# basina ayri bir veri satiri olarak YOK (dogrulandi: 1994/1999/2004yerel
# ilceler listeleri sadece 31-32 (pre-2008) TAM ilce adi iceriyor). Yani bu
# beldelerin oy verisi zaten SADECE kendi donemin bagli oldugu ILCE'nin
# satirina dahildi - bu dosyanin amaci o ILCE'nin (orn. Umraniye, Kartal,
# Gaziosmanpasa) GUNCEL poligonunu, ondan 2008'de ayrilan mahallelerle
# GENISLETEREK dogru (tarihsel) sekle getirmek; "Ilk Kademe Belediyesi"nin
# KENDI ayri bir secim sonucu YOK, sadece hangi ESKI ILCE'ye ait oldugunu
# bilmemiz gerekiyor.

