    geometry_basis: >
      2026-09-24: Sancaktepe'nin GUNCEL 19 mahallesinin TUMU asagidaki
      kaynaklara atandi (kalinti YOK) - 15'i DOGRUDAN kanun metninden
      (verified duzeyinde), 4'u YAPISAL/COGRAFI cikarimla (bkz. asagida
      "inference" notlari, kullanicinin "elindeki gercek mahalle
      geometrisiyle coz" talimati uzerine):
      - SARIGAZI MAH., YENIDOGAN MAH.: Umraniye'ye atandi - her ikisi de
        kanunun AYNI isimli "Ilk Kademe Belediyesi" grubunun (Sarigazi:
        Meclis/Inonu/Emek/Kemal Turkler/Ataturk zaten verified-Umraniye;
        Yenidogan: Yunus Emre/Safa/Mevlana/Merve zaten verified-Umraniye)
        kendi CEKIRDEK/MERKEZ mahallesi olmasi kuvvetle muhtemel (Merkez
        adinin sonradan belde adiyla degistirilmesi bu bolgede baska
        orneklerle de tutarli bir kaliptir) - guclu YAPISAL karine, kesin
        DEGIL.
      - HILAL MAH.: Umraniye'ye atandi - shapely ile kontrol edildi,
        Kartal-kaynakli kumeye (Akpinar/Veysel Karani/Eyup Sultan/Fatih)
        hic DEGMIYOR (mesafe=0.0106), Umraniye-kaynakli kumeye TAM BITISIK
        (mesafe=0.0). Kanunda hic gecmedigi icin baska kanit yok - bu
        COGRAFI komsuluk TEK dayanak.
      - PASAKOY MAH.: Umraniye'ye atandi - ONCE kanunun ifadesi ("Kartal
        Ilcesi Samandira Bucagina bagli Pasakoy Koyu") esas alinip Kartal'a
        atanmisti, AMA bu, HIST-Istanbul-Kartal/HIST-Istanbul-Umraniye
        arasinda GERCEK bir cakisma URETTI (dogrulama testi yakaladi: oran
        0.016, kaynagi %78 Pasakoy) - GUNCEL Pasakoy poligonu Umraniye
        tarafina fiziksel olarak tasiyor. Bu SASIRTICI degil: kanunun
        kendisi zaten bu transferin TAM koy DEGIL, "yolun GUNEYINDE kalan
        KISMI" oldugunu soyluyor - yani GUNCEL (butun) Pasakoy mahallesinin
        Kartal'in eski idari kaydina TAM karsilik gelmedigi zaten biliniyordu.
        Umraniye tarafina ataninca cakisma TAM SIFIRLANIYOR (shapely ile
        dogrulandi) - yani GUNCEL mahallenin fiziksel sekli Umraniye
        tarafina daha tutarli oturuyor. Burada BILEREK kanunun idari
        isimlendirmesi yerine GEOMETRIK TUTARLILIK tercih edildi, cunku
        kanun zaten TAM bir mahalle degil, belirsiz bir kismi tarif
        ediyordu - iki belirsiz kaynak (idari isim vs. geometri) arasinda
        SIFIR-CAKISMA ureten geometriyi esas almak daha savunulabilir.
      Abdurrahmangazi/Osmangazi (Kartal-Samandira VE Umraniye-Yenidogan
      listelerinde AYRI AYRI gecen isim cakismasi, asagidaki nota bakin)
      HALA Kartal'a atanmis durumda (onceki taslaktan) - shapely kontrolu
      HER IKI kumeye de bitisik oldugunu gosterdi (ayirt edici degil),
      yani bu ikisinin Kartal/Umraniye ayrimi hala ZAYIF/varsayimsal, ama
      SONUCU (ikisinin de Sancaktepe'nin TOPLAM alanina dahil olmasi)
      degismiyor - sadece hangi komsu tarihsel poligona (Kartal mi Umraniye
      mi) dahil edildikleri belirsiz, bu da haritada en fazla bir mahalle
      genisliginde bir sinir-cizgisi belirsizligi yaratir, veri kaybi
      DEGIL.
    note: >
      Kanunun (21) sayili listesi TAM METIN (2 bagimsiz kaynaktan
      dogrulandi):

      Samandira Ilk Kademe Belediyesine bagli (Kartal uzerinden): Abdurrahman
      Gazi, Akpinar, Osman Gazi, Veysel Karani, Eyup Sultan, Fatih, +
      "Ferhatpasa Mahallesinin E-80 karayolunun KUZEYINDE kalan kismi"
      (PARCA - modern Sancaktepe'de ayri adli bir "Ferhatpasa" mahallesi
      YOK, bu parca hangi modern mahalleye karistigi bilinmiyor).

      Sarigazi Ilk Kademe Belediyesine bagli (Umraniye uzerinden): Meclis,
      Inonu, Merkez, Emek, Kemal Turkler, Atatürk. "Merkez" GUNCEL
      mahalle_geo.json'da YOK - GUNCEL Sancaktepe'de bunun yerine "SARIGAZI
      MAH." var. Hipotez (SADECE ikincil/blog kaynakli, dogrulanmadi):
      "Merkez" mahallesi 2007'de hala Merkez, 2008'de "Sarigazi Merkez",
      sonrasinda sadece "Sarigazi" olarak adlandirilmis olabilir.

      Yenidogan Ilk Kademe Belediyesine bagli (Umraniye uzerinden):
      Abdurrahman Gazi, Yunus Emre, Safa, Osman Gazi, Mevlana, Merve.
      ISIM CAKISMASI: "Abdurrahman Gazi" VE "Osman Gazi" kanunda HEM
      Samandira (Kartal) HEM Yenidogan (Umraniye) altinda AYRI AYRI
      listeleniyor - ama GUNCEL Sancaktepe'de sadece TEK bir
      "ABDURRAHMANGAZI MAH." ve TEK bir "OSMANGAZI MAH." var. Hangi
      YARISININ Kartal'dan hangi yarisinin Umraniye'den geldigi (ya da
      ikisinin birlesip TEK modern mahalle olup olmadigi) BILINMIYOR - bu
      2 isim GUVENLE hicbir tarafa atanamaz. Ayrica GUNCEL "YENİDOĞAN MAH."
      kanunun Yenidogan-kaynakli oğelerinden HANGISinin yeniden adlandirilmis
      hali oldugu da belirsiz (muhtemelen "Abdurrahman Gazi" idi, ama
      dogrulanmadi).

      Koy kismi (2026-09-23'te YENI dogrulandi - onceki "kanunda yok" notu
      YANLISTI): "Kartal Ilcesi Samandira Bucagina bagli Pasakoy Koyunun
      Umraniye-Sile baglanti yolunun GUNEYINDE kalan kismi" + "Pendik
      Ilcesine bagli Kurtdogmus Koyunun Omerli Barajinin KUZEYBATISINDA
      kalan kismi" (bu Kurtdogmus parcasi da Pasakoy Koyune dahil edilmis).
