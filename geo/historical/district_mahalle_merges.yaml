      - "https://cdn.tbmm.gov.tr/KKBSPublicFile/D23/Y2/T1/KanunMetni/2af6a825-3e55-49e3-8b03-3d0b85ad6503.html"
    old_parent: ["Kartal (Samandıra İlk Kademe Belediyesi üzerinden)", "Ümraniye (Sarıgazi + Yenidoğan İlk Kademe Belediyeleri üzerinden)"]
