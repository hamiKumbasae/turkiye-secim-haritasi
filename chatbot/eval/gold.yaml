# Altın değerlendirme kümesi (gold eval set).
# Her soru için SQL elle yazıldı ve yerel MariaDB'de çalıştırılıp sonucu doğrulandı.
# expected_answer: doğru cevabın insan tarafından yazılmış kısa özeti (sayılar DB'den).
# ordered: true ise sonuç sırası da karşılaştırılır (top-N, zaman serisi).
# Gold SQL yalnız sorunun gerektirdiği sütunları döndürür; modelin fazladan sütunu sorun değildir.
# Karşılaştırma kuralları için bkz. secim_chatbot/evaluation.py.

- id: g01
  category: ulusal-toplam
  expected_answer: "AK Parti 2023 genel seçiminde yurt dışı dahil 19.127.097 oy aldı."
  question: 2023 genel seçiminde AK Parti Türkiye genelinde kaç oy aldı?
  ordered: false
  sql: |
    SELECT SUM(o.oy) AS oy
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2023' AND b.seviye IN ('il','yurtdisi') AND o.aday_parti = 'AK Parti'

- id: g02
  category: ulusal-toplam
  expected_answer: "AK Parti %35,23, CHP %25,12, MHP %9,96, İYİ Parti %9,61, YEŞİL SOL %8,83."
  question: 2023 genel seçiminde Türkiye genelinde en çok oy alan 5 partinin oy oranları neydi?
  ordered: true
  sql: |
    SELECT o.aday_parti,
           ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                    WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2023' AND b.seviye IN ('il','yurtdisi')
    GROUP BY o.aday_parti ORDER BY SUM(o.oy) DESC LIMIT 5

