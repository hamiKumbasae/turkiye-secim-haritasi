- id: b230
  category: takip-belirsiz
  split: test
  question: Atakent mahallesinde 2023'te milletvekili seçiminde hangi parti önde?
  frequency: düşük
  evidence: S19
  answerable: 'yes'
  note: 'Belirsiz: Türkiye''de 13 Atakent Mahallesi var. Varsayılan: hepsini il/ilçe ile listele ve kullanıcıya hangisi olduğunu
    sor.'
  expected_answer: Adana Yüreğir AK Parti; Ankara Etimesgut CHP; Gaziantep Şehitkamil AK Parti; İstanbul Küçükçekmece CHP;
    İstanbul Ümraniye CHP; İzmir Karşıyaka CHP; Kocaeli Başiskele AK Parti; Konya Akşehir AK Parti … (toplam 12 satır).
  ordered: false
  sql: |
    SELECT il.ad AS il, i.ad AS ilce, m.kazanan
    FROM birim m JOIN secim s ON s.id = m.secim_id
    JOIN birim i ON i.secim_id = m.secim_id AND i.seviye = 'ilce' AND i.geom_id = m.ust_geom_id
    JOIN birim il ON il.secim_id = m.secim_id AND il.seviye = 'il' AND il.plaka = i.plaka
    WHERE s.kod = '2023' AND m.seviye = 'mahalle' AND m.ad LIKE 'ATAKENT MAH%'
    ORDER BY il.ad, i.ad

