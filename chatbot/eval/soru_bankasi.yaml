- id: b109
  category: turlar-arasi
  split: test
  question: Kılıçdaroğlu'nun oy oranı ilk turdan ikinci tura hangi illerde düştü?
  frequency: orta
  evidence: S15, S31
  answerable: 'yes'
  expected_answer: Şanlıurfa 36,09 35,14 -0,95; Mardin 66,11 65,24 -0,87; Siirt 56,26 55,44 -0,82; Van 62,26 61,50 -0,76;
    Bitlis 50,91 50,21 -0,70; Bingöl 32,53 31,92 -0,61; Muş 58,88 58,33 -0,55; Ağrı 65,80 65,34 -0,46 … (toplam 11 satır).
  ordered: false
  sql: |
    SELECT b1.ad AS il, o1.oran AS tur1, o2.oran AS tur2, ROUND(o2.oran - o1.oran, 2) AS fark
    FROM oy o1 JOIN birim b1 ON b1.id = o1.birim_id JOIN secim s1 ON s1.id = b1.secim_id
    JOIN secim s2 ON s2.kod = '2023cb2tur'
    JOIN birim b2 ON b2.secim_id = s2.id AND b2.seviye = 'il' AND b2.plaka = b1.plaka
    JOIN oy o2 ON o2.birim_id = b2.id AND o2.aday_parti = 'Kemal Kılıçdaroğlu'
    WHERE s1.kod = '2023cb1tur' AND b1.seviye = 'il' AND o1.aday_parti = 'Kemal Kılıçdaroğlu'
      AND o2.oran < o1.oran
    ORDER BY fark

