    JOIN birim bc ON bc.secim_id = sc.id AND bc.seviye = 'il' AND bc.plaka = bg.plaka
    JOIN oy oc ON oc.birim_id = bc.id AND oc.aday_parti = 'Recep Tayyip Erdoğan'
