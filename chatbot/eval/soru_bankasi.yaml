- id: b013
  category: ulusal-toplam
  split: test
  question: 2023'te Cumhur İttifakı ve Millet İttifakı toplamda yüzde kaç aldı?
  frequency: yüksek
  evidence: S26, S34
  answerable: partial
  reason: 'Veritabanında ittifak üyeliği yok; sorgu üyeliği elle kodlar (Cumhur: AK Parti, MHP, YENİDEN REFAH + yalnız ittifaka
    verilen oylar; Millet: CHP, İYİ Parti + yalnız ittifaka verilen oylar; DEVA/Gelecek/SP/DP CHP listesinden girdi).'
  expected_answer: Cumhur İttifakı 48,49; Millet İttifakı 35,05.
  ordered: false
  sql: |
    SELECT CASE WHEN o.aday_parti IN ('AK Parti','MHP','YENİDEN REFAH','Cumhur İttifakı') THEN 'Cumhur İttifakı'
                ELSE 'Millet İttifakı' END AS ittifak,
           ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                    WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2023' AND b.seviye IN ('il','yurtdisi')
      AND o.aday_parti IN ('AK Parti','MHP','YENİDEN REFAH','Cumhur İttifakı','CHP','İYİ Parti','Millet İttifakı')
    GROUP BY ittifak, s.id ORDER BY oran DESC

