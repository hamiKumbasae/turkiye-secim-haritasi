- id: b199
  category: rekor-siralama
  split: test
  question: Türkiye genel seçimlerinde en yüksek oy oranını alan 10 parti hangileri?
  frequency: orta
  evidence: S18
  answerable: 'yes'
  note: Her seçimde birinci partinin oranı; 2018 sonrası oranlar ittifak oyu dağıtılmadığı için resmîden biraz düşüktür.
  expected_answer: 1954 DP 57,50; 1950 DP 54,40; 1965 AP 52,87; 2011 AK Parti 49,80; 2015Kasim AK Parti 49,49; 1957 DP 47,85;
    2007 AK Parti 46,58; 1969 AP 46,53 … (toplam 10 satır).
  ordered: true
  sql: |
    SELECT t.kod, t.aday_parti, t.oran FROM (
      SELECT s.kod, o.aday_parti,
             ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                      WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
      FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
      WHERE s.tur = 'genel' AND b.seviye IN ('il','yurtdisi') AND o.aday_parti NOT IN ('Bağımsız','Diğer')
      GROUP BY s.id, s.kod, o.aday_parti
    ) t ORDER BY t.oran DESC LIMIT 10

