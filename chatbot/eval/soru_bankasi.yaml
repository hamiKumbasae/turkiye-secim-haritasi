    WHERE s.kod = '2024yerel' AND m.seviye = 'mahalle' AND i.plaka = 34 AND i.ad = 'Ümraniye' AND m.kazanan = 'CHP'

- id: b245
  category: referandum
  split: dev
  question: 2017 referandumunda Hayır'ın en yüksek çıktığı ilçe
  frequency: düşük
  evidence: S04
  answerable: 'yes'
  expected_answer: Hatay Defne 93,52.
  ordered: false
  sql: |
    SELECT il.ad AS il, b.ad AS ilce, o.oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    JOIN birim il ON il.secim_id = b.secim_id AND il.seviye = 'il' AND il.plaka = b.plaka
    WHERE s.kod = '2017referandum' AND b.seviye = 'ilce' AND o.aday_parti = 'Hayır'
    ORDER BY o.oran DESC LIMIT 1

