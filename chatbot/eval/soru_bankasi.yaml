- id: b159
  category: zaman-serisi
  split: test
  question: CHP'nin 1950'den bugüne genel seçimlerdeki Türkiye geneli oy oranı
  frequency: yüksek
  evidence: S18, S20
  answerable: 'yes'
  note: 2023'te CHP listesinde DEVA/Gelecek/SP/DP adayları da vardı; 1983–1991 arası CHP kapalıydı (SHP/DSP).
  expected_answer: 1950 40,63; 1954 35,29; 1957 41,07; 1961 36,72; 1965 28,75; 1969 27,36; 1973 33,29; 1977 41,36 … (toplam
    16 satır).
  ordered: true
  sql: |
    SELECT s.kod,
           ROUND(100 * SUM(CASE WHEN o.aday_parti = 'CHP' THEN o.oy ELSE 0 END) / SUM(o.oy), 2) AS chp_orani
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.tur = 'genel' AND b.seviye IN ('il','yurtdisi')
    GROUP BY s.id, s.kod, s.yil
    HAVING chp_orani > 0
    ORDER BY s.yil, s.id

