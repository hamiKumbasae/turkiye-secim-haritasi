# Soru bankası (question bank): gerçek kullanıcıların seçim sonuçları hakkında sorduğu soru TÜRLERİNDEN
# türetilmiş, elle yazılmış Türkçe sorular. Araştırma ve kaynaklar: docs/RESEARCH.md (S01… anahtarları).
# Orijinal 32 soruluk gold.yaml'dan ayrıdır; ona dokunulmaz.
#
# Alanlar
#   category     soru türü (ulusal-toplam, il, ilce, mahalle, vekil, cumhurbaskanligi, turlar-arasi, referandum,
#                yerel, katilim, zaman-serisi, degisim, fark, rekor-siralama, capraz, bolge, takip-belirsiz, veri-yok)
#   split        test = değerlendirmede kullanılan (held-out) küme; dev = few-shot / prompt geliştirme havuzu.
#                Few-shot örnekleri yalnız dev'den seçilebilir (tests/test_soru_bankasi.py test ile örtüşmeyi engeller).
#   question     kullanıcı sorusu (günlük dil, küçük harf / kısaltma / takip sorusu olabilir)
#   history      takip sorularında önceki tur(lar): {question, sql}; değerlendirmede sohbet geçmişi olarak verilir
#   frequency    yüksek | orta | düşük — kaynaklarda bu soru TÜRÜNÜN ne sık geçtiği (evidence = kaynak anahtarları)
#   answerable   yes | partial | no
#                partial: SQL doğru ve çalışıyor ama veri sınırı var; `reason` yanıtta belirtilmesi gereken uyarıdır
#                no: veri yok; model cannot_answer ile "bu veri bende yok" demeli (expected_behavior)
#   note         belirsizlikte seçilen varsayılan ya da şema tuzağı
#   expected_answer  doğrulanmış sonucun kısa özeti (SQL çalıştırılarak üretildi; ayrıntı soru_bankasi_results.json)
#   ordered      true ise satır sırası da karşılaştırılır
#   sql          yerel MariaDB'de çalıştırılıp sonucu kontrol edilmiş altın SQL (güvenlik katmanından geçer)
#
# Sonuçları yeniden dondurmak: python eval/run_eval.py --set bank --freeze

- id: b001
  category: ulusal-toplam
  split: test
  question: 14 Mayıs seçimlerinde CHP kaç oy aldı?
  frequency: yüksek
  evidence: S02, S11, S21
  answerable: 'yes'
  note: '''14 Mayıs'' hem milletvekili hem cumhurbaşkanlığı 1. turu; parti sorulduğu için milletvekili seçimi (kod ''2023'').'
  expected_answer: oy = 13.637.794.
  ordered: false
  sql: |
    SELECT SUM(o.oy) AS oy
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2023' AND b.seviye IN ('il','yurtdisi') AND o.aday_parti = 'CHP'

- id: b002
  category: ulusal-toplam
  split: test
  question: 2018 genel seçiminde AK Parti yüzde kaç oy aldı?
  frequency: yüksek
  evidence: S17, S18, S21
  answerable: partial
  reason: Veritabanındaki parti oyları yalnız partiye verilen oylardır; yalnız ittifaka verilen oylar ('Cumhur İttifakı' satırı)
    partilere dağıtılmamıştır. Bu yüzden oran YSK'nın resmî %42,56'sından düşüktür; yanıtta bu belirtilmeli.
  expected_answer: oran = 41,84.
  ordered: false
  sql: |
    SELECT ROUND(100 * SUM(CASE WHEN o.aday_parti = 'AK Parti' THEN o.oy ELSE 0 END) / SUM(o.oy), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2018' AND b.seviye IN ('il','yurtdisi')

- id: b003
  category: ulusal-toplam
  split: test
  question: Memleket Partisi 2023 seçimlerinde ne kadar oy aldı?
  frequency: orta
  evidence: S02
  answerable: 'yes'
  expected_answer: 499.752 0,92.
  ordered: false
  sql: |
    SELECT SUM(o.oy) AS oy,
           ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                    WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2023' AND b.seviye IN ('il','yurtdisi') AND o.aday_parti = 'MEMLEKET'
    GROUP BY s.id

- id: b004
  category: ulusal-toplam
  split: dev
  question: 1 Kasım 2015 seçiminde partilerin oy oranları neydi?
  frequency: yüksek
  evidence: S10, S11
  answerable: 'yes'
  expected_answer: AK Parti 49,49; CHP 25,32; MHP 11,91; HDP 10,76; SP 0,67; BBP 0,52; VATAN 0,24; HAK-PAR 0,22 … (toplam
    18 satır).
  ordered: true
  sql: |
    SELECT o.aday_parti,
           ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                    WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2015Kasim' AND b.seviye IN ('il','yurtdisi')
    GROUP BY o.aday_parti ORDER BY SUM(o.oy) DESC

- id: b005
  category: ulusal-toplam
  split: test
  question: 2002 seçiminde yüzde 10 barajını hangi partiler geçebildi?
  frequency: orta
  evidence: S34, S18
  answerable: 'yes'
  note: Baraj %10 (1983–2018), 2023'te %7. 'Bağımsız' parti değildir; listeden çıkarılır.
  expected_answer: AK Parti 34,43; CHP 19,41.
  ordered: false
  sql: |
    SELECT o.aday_parti,
           ROUND(100 * SUM(o.oy) / (SELECT SUM(o2.oy) FROM oy o2 JOIN birim b2 ON b2.id = o2.birim_id
                                    WHERE b2.secim_id = s.id AND b2.seviye IN ('il','yurtdisi')), 2) AS oran
    FROM oy o JOIN birim b ON b.id = o.birim_id JOIN secim s ON s.id = b.secim_id
    WHERE s.kod = '2002' AND b.seviye IN ('il','yurtdisi') AND o.aday_parti NOT IN ('Bağımsız','Diğer')
    GROUP BY o.aday_parti, s.id
    HAVING oran >= 10
    ORDER BY oran DESC

